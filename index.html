<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مطاعم بعشيقة | منصة طلب الطعام</title>
    <!-- FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary-color: #ff5a00;
            --primary-hover: #e04f00;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #22c55e;
            --border-color: #334155;
            --bottom-nav-height: 60px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: calc(var(--bottom-nav-height) + 20px);
        }

        /* Navbar العلوي */
        .navbar {
            background-color: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
            padding: 12px 15px;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .logo {
            font-size: 20px;
            font-weight: 900;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 9px 38px 9px 12px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-dark);
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .search-box i {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }

        .nav-actions-desktop {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-action {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }

        .btn-action:active {
            transform: scale(0.96);
        }

        .cart-count {
            background-color: var(--primary-color);
            color: white;
            font-size: 11px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .user-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
        }

        .user-pill img {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            object-fit: cover;
        }

        /* Bottom Navigation للهاتف فقط */
        .bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: var(--bottom-nav-height);
            background-color: rgba(30, 41, 59, 0.98);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border-color);
            z-index: 900;
            justify-content: space-around;
            align-items: center;
        }

        .bottom-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 11px;
            gap: 3px;
            position: relative;
            background: none;
            border: none;
            cursor: pointer;
            width: 25%;
            height: 100%;
        }

        .bottom-nav-item i {
            font-size: 18px;
        }

        .bottom-nav-item.active, .bottom-nav-item:active {
            color: var(--primary-color);
        }

        .bottom-nav-item .cart-badge-bottom {
            position: absolute;
            top: 6px;
            right: 22%;
            background-color: var(--primary-color);
            color: white;
            font-size: 10px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* Main Container */
        .main-container {
            max-width: 1200px;
            margin: 15px auto;
            padding: 0 12px;
        }

        /* التصنيفات بالتمرير الأفقي السلس للمس */
        .categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 20px;
            scrollbar-width: none; /* Firefox */
        }
        .categories::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        .category-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 20px;
            white-space: nowrap;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            flex-shrink: 0;
        }

        .category-btn.active {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
        }

        .section-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* شبكة المطاعم */
        .restaurants-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
        }

        .restaurant-card {
            background-color: var(--card-bg);
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            cursor: pointer;
            position: relative;
        }

        .restaurant-img {
            width: 100%;
            height: 140px;
            object-fit: cover;
        }

        .restaurant-info {
            padding: 12px;
        }

        .restaurant-name {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .restaurant-cat {
            color: var(--text-muted);
            font-size: 12px;
            margin-bottom: 10px;
        }

        .restaurant-meta {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 8px;
        }

        .rating {
            color: #f59e0b;
            font-weight: bold;
        }

        .owner-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(34, 197, 94, 0.95);
            color: white;
            font-size: 10px;
            padding: 3px 7px;
            border-radius: 8px;
            font-weight: bold;
        }

        /* النوافذ المنبثقة (Modals) للهاتف */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: flex-end; /* تفتح من الأسفل بالهواتف */
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background-color: var(--card-bg);
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-width: 650px;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-bottom: none;
            position: relative;
            padding: 20px 18px;
            animation: slideUp 0.25s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .close-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 22px;
            color: var(--text-muted);
            cursor: pointer;
            z-index: 10;
        }

        .modal-header-img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 12px;
        }

        /* قائمة الطعام بالمنفذ */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }

        .menu-item-card {
            background-color: var(--bg-dark);
            border-radius: 10px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .menu-item-img {
            width: 100%;
            height: 95px;
            object-fit: cover;
        }

        .menu-item-details {
            padding: 8px;
        }

        .menu-item-name {
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 4px;
        }

        .menu-item-price {
            color: var(--primary-color);
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        /* النماذج */
        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 9px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-dark);
            color: #fff;
            outline: none;
            font-size: 13px;
        }

        .form-switch-text {
            text-align: center;
            margin-top: 12px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .form-switch-text span {
            color: var(--primary-color);
            cursor: pointer;
            font-weight: bold;
        }

        /* قائمة السلة الجانبية/السفلية */
        .cart-sidebar {
            position: fixed;
            top: 0;
            left: -100%;
            width: 100%;
            max-width: 350px;
            height: 100%;
            background-color: var(--card-bg);
            z-index: 1100;
            box-shadow: 5px 0 25px rgba(0, 0, 0, 0.5);
            transition: 0.3s ease;
            display: flex;
            flex-direction: column;
            padding: 15px;
            border-right: 1px solid var(--border-color);
        }

        .cart-sidebar.open {
            left: 0;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            margin: 12px 0;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
        }

        /* الاستجابة للشاشات الكبيرة والشاشات الصغيرة (Media Queries) */
        @media (max-width: 768px) {
            .nav-actions-desktop {
                display: none; /* إخفاء أزرار الهيدر والاعتماد على Bottom Nav في الهاتف */
            }

            .bottom-nav {
                display: flex; /* إظهار شريط التنقل السفلي للهاتف */
            }

            .restaurants-grid {
                grid-template-columns: repeat(auto-fill, minmax(100%, 1fr));
            }

            .modal {
                align-items: flex-end;
            }

            .modal-content {
                border-radius: 18px 18px 0 0;
                padding-bottom: calc(var(--bottom-nav-height) + 15px);
            }

            .cart-sidebar {
                max-width: 100%; /* السلة تملأ الشاشة في الهواتف */
            }
        }

        @media (min-width: 769px) {
            .modal {
                align-items: center;
            }
            .modal-content {
                border-radius: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- Navbar العلوي -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="logo"><i class="fa-solid fa-utensils"></i> مطاعم بعشيقة</a>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="ابحث عن مطعم أو وجبة..." onkeyup="filterRestaurants()">
            </div>
            <!-- الأزرار للشاشات الكبيرة -->
            <div class="nav-actions-desktop" id="navAuthArea"></div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-container">
        <!-- التصنيفات بتمرير أفقي -->
        <div class="categories">
            <button class="category-btn active" onclick="filterCategory('all', this)"><i class="fa-solid fa-border-all"></i> الكل</button>
            <button class="category-btn" onclick="filterCategory('fastfood', this)"><i class="fa-solid fa-burger"></i> وجبات سريعة</button>
            <button class="category-btn" onclick="filterCategory('pizza', this)"><i class="fa-solid fa-pizza-slice"></i> بيتزا</button>
            <button class="category-btn" onclick="filterCategory('grill', this)"><i class="fa-solid fa-drumstick-bite"></i> مشاوي</button>
            <button class="category-btn" onclick="filterCategory('sweets', this)"><i class="fa-solid fa-ice-cream"></i> حلويات</button>
        </div>

        <h2 class="section-title"><i class="fa-solid fa-store" style="color: var(--primary-color);"></i> المطاعم المتاحة</h2>
        
        <!-- قائمة المطاعم -->
        <div class="restaurants-grid" id="restaurantsContainer"></div>
    </div>

    <!-- شريط التنقل السفلي السريع للهاتف (Bottom Navigation Bar) -->
    <div class="bottom-nav">
        <button class="bottom-nav-item active" onclick="scrollToTop()">
            <i class="fa-solid fa-house"></i>
            <span>الرئيسية</span>
        </button>
        <button class="bottom-nav-item" onclick="focusSearch()">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>بحث</span>
        </button>
        <button class="bottom-nav-item" onclick="toggleCart()">
            <i class="fa-solid fa-basket-shopping"></i>
            <span class="cart-badge-bottom" id="cartCountBottom">0</span>
            <span>السلة</span>
        </button>
        <button class="bottom-nav-item" id="bottomNavUserBtn" onclick="handleBottomUserClick()">
            <i class="fa-solid fa-user"></i>
            <span id="bottomNavUserText">حسابي</span>
        </button>
    </div>

    <!-- Modal: Auth (Login / Register) -->
    <div class="modal" id="authModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('authModal')">&times;</span>
            <h2 id="authModalTitle" style="color: var(--primary-color); margin-bottom: 4px; text-align: center;">تسجيل الدخول</h2>
            <p id="authModalSub" style="color: var(--text-muted); font-size: 12px; margin-bottom: 16px; text-align: center;">أدخل بيانات حسابك للمتابعة</p>
            
            <form id="authForm" onsubmit="handleAuthSubmit(event)">
                <div class="form-group" id="nameFieldGroup" style="display: none;">
                    <label>الاسم الكامل</label>
                    <input type="text" id="authName" placeholder="أدخل اسمك الكامل">
                </div>
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="authEmail" required placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="authPassword" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-action" id="authSubmitBtn" style="width: 100%; justify-content: center; margin-top: 8px;">دخول</button>
            </form>

            <div class="form-switch-text" id="authSwitchText">
                ليس لديك حساب؟ <span onclick="toggleAuthMode()">إنشاء حساب جديد</span>
            </div>
        </div>
    </div>

    <!-- Modal: Edit Profile -->
    <div class="modal" id="profileModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('profileModal')">&times;</span>
            <h2 style="color: var(--primary-color); margin-bottom: 12px;">تعديل الملف الشخصي</h2>
            <form onsubmit="handleSaveProfile(event)">
                <div class="form-group">
                    <label>الاسم الظاهر</label>
                    <input type="text" id="editProfileName" required>
                </div>
                <div class="form-group">
                    <label>رابط الصورة الشخصية</label>
                    <input type="url" id="editProfileAvatar" required placeholder="https://example.com/avatar.jpg">
                </div>
                <button type="submit" class="btn-action" style="width: 100%; justify-content: center; margin-top: 8px;">حفظ التغييرات</button>
                <button type="button" class="btn-action" style="width: 100%; justify-content: center; margin-top: 8px; background: #334155;" onclick="logout()">تسجيل الخروج</button>
            </form>
        </div>
    </div>

    <!-- Modal: Menu -->
    <div class="modal" id="menuModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('menuModal')">&times;</span>
            <img id="modalRestImg" class="modal-header-img" src="" alt="مطعم">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <div>
                    <h2 id="modalRestName" style="color: var(--primary-color); font-size: 18px;"></h2>
                    <p id="modalRestCat" style="color: var(--text-muted); font-size: 12px;"></p>
                </div>
                <div id="ownerActionsContainer"></div>
            </div>
            
            <h3 style="border-bottom: 1px solid var(--border-color); padding-bottom: 6px; font-size: 14px;"><i class="fa-solid fa-utensils"></i> قائمة الطعام</h3>
            <div class="menu-grid" id="menuContainer"></div>
        </div>
    </div>

    <!-- Modal: Add / Edit Restaurant -->
    <div class="modal" id="addRestaurantModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('addRestaurantModal')">&times;</span>
            <h2 id="modalFormTitle" style="color: var(--primary-color); margin-bottom: 12px;">إضافة مطعم جديد</h2>
            <form id="addRestForm" onsubmit="handleSaveRestaurant(event)">
                <input type="hidden" id="editRestId">
                <div class="form-group">
                    <label>اسم المطعم</label>
                    <input type="text" id="newRestName" required placeholder="مثال: برغر هاوس">
                </div>
                <div class="form-group">
                    <label>الفئة</label>
                    <select id="newRestCat">
                        <option value="fastfood">وجبات سريعة</option>
                        <option value="pizza">بيتزا</option>
                        <option value="grill">مشاوي</option>
                        <option value="sweets">حلويات</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>رابط صورة المطعم</label>
                    <input type="url" id="newRestImg" required placeholder="https://example.com/image.jpg">
                </div>
                <div class="form-group">
                    <label>اسم الوجبة</label>
                    <input type="text" id="newItemName" required placeholder="مثال: تشيز برغر">
                </div>
                <div class="form-group">
                    <label>رابط صورة الوجبة</label>
                    <input type="url" id="newItemImg" required placeholder="https://example.com/meal.jpg">
                </div>
                <div class="form-group">
                    <label>سعر الوجبة (د.ع)</label>
                    <input type="number" id="newItemPrice" required placeholder="7000">
                </div>
                <button type="submit" class="btn-action" style="width: 100%; justify-content: center; margin-top: 8px;">حفظ المطعم</button>
            </form>
        </div>
    </div>

    <!-- Cart Sidebar -->
    <div class="cart-sidebar" id="cartSidebar">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">
            <h3 style="font-size: 16px;">سلة التسوق <i class="fa-solid fa-basket-shopping" style="color: var(--primary-color);"></i></h3>
            <span style="cursor: pointer; font-size: 20px;" onclick="toggleCart()">&times;</span>
        </div>
        <div class="cart-items" id="cartItemsContainer"></div>
        <div style="border-top: 1px solid var(--border-color); padding-top: 12px;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px;">
                <span>المجموع:</span>
                <span id="cartTotal" style="color: var(--primary-color); font-weight: bold;">0 د.ع</span>
            </div>
            <button class="btn-action" style="width: 100%; justify-content: center;" onclick="checkout()">إتمام الطلب</button>
        </div>
    </div>

    <script>
        const defaultRestaurants = [
            {
                id: 1,
                ownerId: "system",
                name: "برغر اكسبرس",
                category: "fastfood",
                image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500",
                rating: "4.8",
                time: "20-30 دقيقة",
                menu: [
                    { id: 101, name: "كلاسيك برغر", price: 6000, image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500" },
                    { id: 102, name: "دبل تشيز برغر", price: 8500, image: "https://images.unsplash.com/photo-1586190848861-99aa4a171e90?w=500" }
                ]
            },
            {
                id: 2,
                ownerId: "system",
                name: "بيتزا روما",
                category: "pizza",
                image: "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500",
                rating: "4.6",
                time: "30-40 دقيقة",
                menu: [
                    { id: 201, name: "بيتزا مارغريتا", price: 9000, image: "https://images.unsplash.com/photo-1604382355076-af4b0eb60143?w=500" }
                ]
            }
        ];

        let restaurants = JSON.parse(localStorage.getItem('beshīqa_restaurants')) || defaultRestaurants;
        let usersDB = JSON.parse(localStorage.getItem('beshīqa_users')) || [];
        let currentUser = JSON.parse(localStorage.getItem('beshīqa_user')) || null;
        let cart = [];
        let isRegisterMode = false;

        function updateAuthUI() {
            const navAuthArea = document.getElementById('navAuthArea');
            const bottomNavText = document.getElementById('bottomNavUserText');
            
            if (currentUser) {
                if (navAuthArea) {
                    navAuthArea.innerHTML = `
                        <div class="user-pill" onclick="openProfileModal()">
                            <img src="${currentUser.avatar || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}">
                            <span>${currentUser.name}</span>
                        </div>
                        <button class="btn-action" onclick="openAddModal()"><i class="fa-solid fa-plus"></i> إضافة</button>
                        <button class="btn-action" style="background: #334155;" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i></button>
                    `;
                }
                if (bottomNavText) bottomNavText.innerText = currentUser.name.split(' ')[0];
            } else {
                if (navAuthArea) {
                    navAuthArea.innerHTML = `
                        <button class="btn-action" onclick="openAuthModal()"><i class="fa-solid fa-user"></i> دخول</button>
                    `;
                }
                if (bottomNavText) bottomNavText.innerText = "حسابي";
            }
            updateCart();
        }

        function handleBottomUserClick() {
            if (currentUser) {
                openProfileModal();
            } else {
                openAuthModal();
            }
        }

        function focusSearch() {
            const searchInput = document.getElementById('searchInput');
            searchInput.focus();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function openAuthModal() {
            isRegisterMode = false;
            updateAuthModalView();
            openModal('authModal');
        }

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            updateAuthModalView();
        }

        function updateAuthModalView() {
            const title = document.getElementById('authModalTitle');
            const sub = document.getElementById('authModalSub');
            const nameGroup = document.getElementById('nameFieldGroup');
            const submitBtn = document.getElementById('authSubmitBtn');
            const switchText = document.getElementById('authSwitchText');

            if (isRegisterMode) {
                title.innerText = "إنشاء حساب جديد";
                sub.innerText = "أدخل بياناتك لإنشاء حساب جديد";
                nameGroup.style.display = "block";
                document.getElementById('authName').required = true;
                submitBtn.innerText = "إنشاء الحساب";
                switchText.innerHTML = `لديك حساب بالفعل؟ <span onclick="toggleAuthMode()">تسجيل الدخول</span>`;
            } else {
                title.innerText = "تسجيل الدخول";
                sub.innerText = "أدخل بريدك الإلكتروني وكلمة المرور للوصول لحسابك";
                nameGroup.style.display = "none";
                document.getElementById('authName').required = false;
                submitBtn.innerText = "دخول";
                switchText.innerHTML = `ليس لديك حساب؟ <span onclick="toggleAuthMode()">إنشاء حساب جديد</span>`;
            }
        }

        function handleAuthSubmit(event) {
            event.preventDefault();
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value;

            if (isRegisterMode) {
                const name = document.getElementById('authName').value.trim();
                const existingUser = usersDB.find(u => u.email === email);
                if (existingUser) {
                    alert('هذا البريد الإلكتروني مسجل مسبقاً!');
                    return;
                }

                const newUser = {
                    id: 'user_' + Date.now(),
                    name: name,
                    email: email,
                    password: password,
                    avatar: 'https://cdn-icons-png.flaticon.com/512/149/149071.png'
                };

                usersDB.push(newUser);
                localStorage.setItem('beshīqa_users', JSON.stringify(usersDB));
                currentUser = newUser;
                localStorage.setItem('beshīqa_user', JSON.stringify(currentUser));
                
                closeModal('authModal');
                updateAuthUI();
                renderRestaurants();
                alert('تم إنشاء الحساب بنجاح!');
            } else {
                const foundUser = usersDB.find(u => u.email === email && u.password === password);
                if (!foundUser) {
                    alert('البريد الإلكتروني أو كلمة المرور غير صحيحة!');
                    return;
                }

                currentUser = foundUser;
                localStorage.setItem('beshīqa_user', JSON.stringify(currentUser));
                closeModal('authModal');
                updateAuthUI();
                renderRestaurants();
            }
            document.getElementById('authForm').reset();
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('beshīqa_user');
            closeModal('profileModal');
            updateAuthUI();
            renderRestaurants();
        }

        function openProfileModal() {
            if (!currentUser) return;
            document.getElementById('editProfileName').value = currentUser.name;
            document.getElementById('editProfileAvatar').value = currentUser.avatar;
            openModal('profileModal');
        }

        function handleSaveProfile(event) {
            event.preventDefault();
            if (!currentUser) return;

            currentUser.name = document.getElementById('editProfileName').value.trim();
            currentUser.avatar = document.getElementById('editProfileAvatar').value.trim();

            const index = usersDB.findIndex(u => u.id === currentUser.id);
            if (index !== -1) {
                usersDB[index] = currentUser;
                localStorage.setItem('beshīqa_users', JSON.stringify(usersDB));
            }

            localStorage.setItem('beshīqa_user', JSON.stringify(currentUser));
            closeModal('profileModal');
            updateAuthUI();
        }

        function renderRestaurants(data = restaurants) {
            const container = document.getElementById('restaurantsContainer');
            container.innerHTML = '';
            
            data.forEach(rest => {
                let isOwner = currentUser && rest.ownerId === currentUser.id;
                container.innerHTML += `
                    <div class="restaurant-card" onclick="openMenu(${rest.id})">
                        <img src="${rest.image}" class="restaurant-img" alt="${rest.name}">
                        ${isOwner ? '<span class="owner-badge"><i class="fa-solid fa-crown"></i> مطعمك</span>' : ''}
                        <div class="restaurant-info">
                            <div class="restaurant-name">${rest.name}</div>
                            <div class="restaurant-cat">${getCategoryName(rest.category)}</div>
                            <div class="restaurant-meta">
                                <span class="rating"><i class="fa-solid fa-star"></i> ${rest.rating}</span>
                                <span><i class="fa-regular fa-clock"></i> ${rest.time}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function getCategoryName(cat) {
            const names = { fastfood: "وجبات سريعة", pizza: "بيتزا", grill: "مشاوي", sweets: "حلويات" };
            return names[cat] || cat;
        }

        function filterCategory(category, btn) {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (category === 'all') {
                renderRestaurants(restaurants);
            } else {
                renderRestaurants(restaurants.filter(r => r.category === category));
            }
        }

        function filterRestaurants() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            renderRestaurants(restaurants.filter(r => r.name.toLowerCase().includes(query)));
        }

        function openMenu(restId) {
            const rest = restaurants.find(r => r.id === restId);
            document.getElementById('modalRestName').innerText = rest.name;
            document.getElementById('modalRestCat').innerText = getCategoryName(rest.category);
            document.getElementById('modalRestImg').src = rest.image;
            
            const ownerActions = document.getElementById('ownerActionsContainer');
            if (currentUser && rest.ownerId === currentUser.id) {
                ownerActions.innerHTML = `<button class="btn-action" onclick="openEditModal(${rest.id})"><i class="fa-solid fa-pen-to-square"></i> تعديل</button>`;
            } else {
                ownerActions.innerHTML = '';
            }

            const menuContainer = document.getElementById('menuContainer');
            menuContainer.innerHTML = '';
            
            rest.menu.forEach(item => {
                menuContainer.innerHTML += `
                    <div class="menu-item-card">
                        <img src="${item.image}" class="menu-item-img" alt="${item.name}">
                        <div class="menu-item-details">
                            <div class="menu-item-name">${item.name}</div>
                            <div class="menu-item-price">${item.price.toLocaleString()} د.ع</div>
                            <button class="btn-action" style="width: 100%; justify-content: center; font-size: 11px; padding: 6px;" onclick="addToCart('${item.name}', ${item.price})"><i class="fa-solid fa-plus"></i> للسلة</button>
                        </div>
                    </div>
                `;
            });

            openModal('menuModal');
        }

        function openAddModal() {
            if (!currentUser) {
                openAuthModal();
                return;
            }
            document.getElementById('modalFormTitle').innerText = 'إضافة مطعم جديد';
            document.getElementById('editRestId').value = '';
            document.getElementById('addRestForm').reset();
            openModal('addRestaurantModal');
        }

        function openEditModal(restId) {
            closeModal('menuModal');
            const rest = restaurants.find(r => r.id === restId);
            document.getElementById('modalFormTitle').innerText = 'تعديل بيانات المطعم';
            document.getElementById('editRestId').value = rest.id;
            document.getElementById('newRestName').value = rest.name;
            document.getElementById('newRestCat').value = rest.category;
            document.getElementById('newRestImg').value = rest.image;
            if (rest.menu.length > 0) {
                document.getElementById('newItemName').value = rest.menu[0].name;
                document.getElementById('newItemImg').value = rest.menu[0].image;
                document.getElementById('newItemPrice').value = rest.menu[0].price;
            }
            openModal('addRestaurantModal');
        }

        function handleSaveRestaurant(event) {
            event.preventDefault();
            if (!currentUser) return;

            const editId = document.getElementById('editRestId').value;
            const name = document.getElementById('newRestName').value;
            const category = document.getElementById('newRestCat').value;
            const image = document.getElementById('newRestImg').value;
            const itemName = document.getElementById('newItemName').value;
            const itemImg = document.getElementById('newItemImg').value;
            const itemPrice = parseInt(document.getElementById('newItemPrice').value);

            if (editId) {
                let rest = restaurants.find(r => r.id == editId);
                if (rest && rest.ownerId === currentUser.id) {
                    rest.name = name;
                    rest.category = category;
                    rest.image = image;
                    rest.menu = [{ id: Date.now(), name: itemName, price: itemPrice, image: itemImg }];
                }
            } else {
                const newRest = {
                    id: Date.now(),
                    ownerId: currentUser.id,
                    name,
                    category,
                    image,
                    rating: "5.0",
                    time: "20-30 دقيقة",
                    menu: [{ id: Date.now() + 1, name: itemName, price: itemPrice, image: itemImg }]
                };
                restaurants.push(newRest);
            }

            localStorage.setItem('beshīqa_restaurants', JSON.stringify(restaurants));
            renderRestaurants();
            closeModal('addRestaurantModal');
            document.getElementById('addRestForm').reset();
        }

        function addToCart(name, price) {
            const existing = cart.find(item => item.name === name);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ name, price, qty: 1 });
            }
            updateCart();
        }

        function updateCart() {
            const cartContainer = document.getElementById('cartItemsContainer');
            cartContainer.innerHTML = '';
            let total = 0;
            let count = 0;

            cart.forEach(item => {
                total += item.price * item.qty;
                count += item.qty;
                cartContainer.innerHTML += `
                    <div class="cart-item">
                        <div>
                            <div style="font-weight: bold; font-size: 13px;">${item.name}</div>
                            <div style="color: var(--text-muted); font-size: 11px;">${item.price.toLocaleString()} د.ع</div>
                        </div>
                        <span style="font-size: 13px; font-weight: bold;">x${item.qty}</span>
                    </div>
                `;
            });

            const cartCountBottom = document.getElementById('cartCountBottom');
            if (cartCountBottom) cartCountBottom.innerText = count;
            const cartTotalEl = document.getElementById('cartTotal');
            if (cartTotalEl) cartTotalEl.innerText = total.toLocaleString() + ' د.ع';
        }

        function toggleCart() {
            document.getElementById('cartSidebar').classList.toggle('open');
        }

        function checkout() {
            if (cart.length === 0) {
                alert('السلة فارغة!');
                return;
            }
            alert('تم استلام طلبك بنجاح! سيصلك الطلب قريباً.');
            cart = [];
            updateCart();
            toggleCart();
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        updateAuthUI();
        renderRestaurants();
    </script>
</body>
</html>
