<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مطاعم بعشيقة | منصة طلب الطعام</title>
    <!-- FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary-color: #ff5a00;
            --primary-hover: #e04f00;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #22c55e;
            --border-color: #334155;
            --bottom-nav-height: 60px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: calc(var(--bottom-nav-height) + 20px);
        }

        .page-view {
            display: none;
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px 12px;
        }
        .page-view.active { display: block; }

        /* Navbar العلوي */
        .navbar {
            background-color: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
            padding: 12px 15px;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .logo {
            font-size: 20px;
            font-weight: 900;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            cursor: pointer;
        }

        .search-box {
            flex: 1;
            max-width: 350px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 9px 38px 9px 12px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-dark);
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .search-box i {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }

        .nav-actions-desktop { display: flex; align-items: center; gap: 8px; }

        .btn-action {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }

        .user-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
        }

        .user-pill img { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; }

        /* Bottom Navigation */
        .bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: var(--bottom-nav-height);
            background-color: rgba(30, 41, 59, 0.98);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border-color);
            z-index: 900;
            justify-content: space-around;
            align-items: center;
        }

        .bottom-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 11px;
            gap: 3px;
            position: relative;
            background: none;
            border: none;
            cursor: pointer;
            width: 25%;
            height: 100%;
        }

        .bottom-nav-item i { font-size: 18px; }
        .bottom-nav-item.active { color: var(--primary-color); }

        .bottom-nav-item .cart-badge-bottom {
            position: absolute;
            top: 6px; right: 22%;
            background-color: var(--primary-color);
            color: white; font-size: 10px;
            width: 16px; height: 16px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold;
        }

        /* التصنيفات */
        .categories {
            display: flex; gap: 10px; overflow-x: auto;
            padding-bottom: 8px; margin-bottom: 20px; scrollbar-width: none;
        }
        .categories::-webkit-scrollbar { display: none; }

        .category-btn {
            background-color: var(--card-bg); border: 1px solid var(--border-color);
            color: var(--text-main); padding: 8px 16px; border-radius: 20px;
            white-space: nowrap; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 13px; flex-shrink: 0;
        }
        .category-btn.active { background-color: var(--primary-color); border-color: var(--primary-color); color: white; }

        .section-title { font-size: 17px; font-weight: 700; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }

        /* شبكة المطاعم */
        .restaurants-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; }
        .restaurant-card { background-color: var(--card-bg); border-radius: 14px; overflow: hidden; border: 1px solid var(--border-color); cursor: pointer; position: relative; transition: 0.2s; }
        .restaurant-card:hover { transform: translateY(-3px); border-color: var(--primary-color); }
        .restaurant-img { width: 100%; height: 140px; object-fit: cover; }
        .restaurant-info { padding: 12px; }
        .restaurant-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
        .restaurant-cat { color: var(--text-muted); font-size: 12px; margin-bottom: 10px; }
        .restaurant-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); border-top: 1px solid var(--border-color); padding-top: 8px; }
        .rating { color: #f59e0b; font-weight: bold; }
        .owner-badge { position: absolute; top: 8px; right: 8px; background: rgba(34, 197, 94, 0.95); color: white; font-size: 10px; padding: 3px 7px; border-radius: 8px; font-weight: bold; }

        /* صفحة الحساب الشخصي */
        .profile-container { background-color: var(--card-bg); border-radius: 16px; padding: 20px; border: 1px solid var(--border-color); max-width: 600px; margin: 0 auto; }
        .profile-header { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 20px; text-align: center; }
        .profile-avatar-wrapper { position: relative; width: 100px; height: 100px; }
        .profile-avatar-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid var(--primary-color); }
        .avatar-upload-btn { position: absolute; bottom: 0; right: 0; background-color: var(--primary-color); color: white; border: none; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        /* صفحة المطعم المستقلة */
        .restaurant-page-banner { width: 100%; height: 220px; object-fit: cover; border-radius: 16px; margin-bottom: 15px; }
        .restaurant-page-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; background-color: var(--card-bg); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); }
        .back-btn { background-color: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 16px; border-radius: 20px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; margin-bottom: 15px; font-size: 13px; }

        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-top: 15px; }
        .menu-item-card { background-color: var(--card-bg); border-radius: 12px; border: 1px solid var(--border-color); overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; }
        .menu-item-img { width: 100%; height: 110px; object-fit: cover; }
        .menu-item-details { padding: 10px; }
        .menu-item-name { font-weight: bold; font-size: 14px; margin-bottom: 4px; }
        .menu-item-price { color: var(--primary-color); font-size: 13px; font-weight: bold; margin-bottom: 8px; }

        /* Modals */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.85); z-index: 1000; justify-content: center; align-items: center; padding: 15px; backdrop-filter: blur(4px); }
        .modal-content { background-color: var(--card-bg); border-radius: 16px; width: 100%; max-width: 450px; max-height: 90vh; overflow-y: auto; border: 1px solid var(--border-color); position: relative; padding: 22px; }
        .close-btn { position: absolute; top: 15px; left: 15px; font-size: 22px; color: var(--text-muted); cursor: pointer; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 4px; font-size: 12px; color: var(--text-muted); }
        .form-group input, .form-group select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background-color: var(--bg-dark); color: #fff; outline: none; font-size: 13px; }
        .form-switch-text { text-align: center; margin-top: 12px; font-size: 12px; color: var(--text-muted); }
        .form-switch-text span { color: var(--primary-color); cursor: pointer; font-weight: bold; }
        .forgot-link { display: block; text-align: left; font-size: 12px; color: var(--primary-color); cursor: pointer; margin-top: 4px; }

        /* سلة التسوق */
        .cart-sidebar { position: fixed; top: 0; left: -100%; width: 100%; max-width: 350px; height: 100%; background-color: var(--card-bg); z-index: 1100; box-shadow: 5px 0 25px rgba(0, 0, 0, 0.5); transition: 0.3s ease; display: flex; flex-direction: column; padding: 15px; border-right: 1px solid var(--border-color); }
        .cart-sidebar.open { left: 0; }
        .cart-items { flex: 1; overflow-y: auto; margin: 12px 0; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border-color); }

        @media (max-width: 768px) {
            .nav-actions-desktop { display: none; }
            .bottom-nav { display: flex; }
            .restaurants-grid { grid-template-columns: 1fr; }
            .modal { align-items: flex-end; }
            .modal-content { border-radius: 18px 18px 0 0; }
            .cart-sidebar { max-width: 100%; }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo" onclick="switchPage('homePage')"><i class="fa-solid fa-utensils"></i> مطاعم بعشيقة</div>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="ابحث عن مطعم أو وجبة..." onkeyup="filterRestaurants()">
            </div>
            <div class="nav-actions-desktop" id="navAuthArea"></div>
        </div>
    </nav>

    <!-- الصفحة الرئيسية -->
    <div class="page-view active" id="homePage">
        <div class="categories">
            <button class="category-btn active" onclick="filterCategory('all', this)"><i class="fa-solid fa-border-all"></i> الكل</button>
            <button class="category-btn" onclick="filterCategory('fastfood', this)"><i class="fa-solid fa-burger"></i> وجبات سريعة</button>
            <button class="category-btn" onclick="filterCategory('pizza', this)"><i class="fa-solid fa-pizza-slice"></i> بيتزا</button>
            <button class="category-btn" onclick="filterCategory('grill', this)"><i class="fa-solid fa-drumstick-bite"></i> مشاوي</button>
            <button class="category-btn" onclick="filterCategory('sweets', this)"><i class="fa-solid fa-ice-cream"></i> حلويات</button>
        </div>

        <h2 class="section-title"><i class="fa-solid fa-store" style="color: var(--primary-color);"></i> المطاعم العامة المتاحة</h2>
        <div class="restaurants-grid" id="restaurantsContainer"></div>
    </div>

    <!-- صفحة المطعم الفردية -->
    <div class="page-view" id="restaurantDetailPage">
        <button class="back-btn" onclick="switchPage('homePage')"><i class="fa-solid fa-arrow-right"></i> العودة للرئيسية</button>
        <img id="restPageBanner" class="restaurant-page-banner" src="" alt="غلاف المطعم">
        <div class="restaurant-page-header">
            <div>
                <h1 id="restPageTitle" style="color: var(--primary-color); font-size: 22px; margin-bottom: 5px;"></h1>
                <p id="restPageCat" style="color: var(--text-muted); font-size: 13px;"></p>
            </div>
            <div id="restPageOwnerActions"></div>
        </div>
        <h3 class="section-title"><i class="fa-solid fa-utensils"></i> قائمة الوجبات والأطباق</h3>
        <div class="menu-grid" id="restPageMenuContainer"></div>
    </div>

    <!-- صفحة حسابي المخصصة -->
    <div class="page-view" id="profilePage">
        <button class="back-btn" onclick="switchPage('homePage')"><i class="fa-solid fa-arrow-right"></i> العودة للرئيسية</button>
        <div class="profile-container">
            <div class="profile-header">
                <div class="profile-avatar-wrapper">
                    <img id="profilePageAvatar" class="profile-avatar-img" src="" alt="الملف الشخصي">
                    <button class="avatar-upload-btn" onclick="triggerAvatarUpload()"><i class="fa-solid fa-camera"></i></button>
                    <input type="file" id="avatarFileInput" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
                </div>
                <h2 id="profilePageName" style="color: var(--primary-color);"></h2>
                <p id="profilePageEmail" style="color: var(--text-muted); font-size: 13px;"></p>
            </div>
            <form onsubmit="handleSaveProfilePage(event)">
                <div class="form-group">
                    <label>الاسم الكامل</label>
                    <input type="text" id="profileInputName" required>
                </div>
                <button type="submit" class="btn-action" style="width: 100%; justify-content: center; margin-top: 10px;">حفظ التغييرات</button>
                <button type="button" class="btn-action" style="width: 100%; justify-content: center; margin-top: 10px; background: #334155;" onclick="promptLogout()">تسجيل الخروج</button>
            </form>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <button class="bottom-nav-item active" id="btnNavHome" onclick="switchPage('homePage')"><i class="fa-solid fa-house"></i><span>الرئيسية</span></button>
        <button class="bottom-nav-item" onclick="focusSearch()"><i class="fa-solid fa-magnifying-glass"></i><span>بحث</span></button>
        <button class="bottom-nav-item" onclick="toggleCart()"><i class="fa-solid fa-basket-shopping"></i><span class="cart-badge-bottom" id="cartCountBottom">0</span><span>السلة</span></button>
        <button class="bottom-nav-item" id="btnNavUser" onclick="handleBottomUserClick()"><i class="fa-solid fa-user"></i><span id="bottomNavUserText">حسابي</span></button>
    </div>

    <!-- Modal: تسجيل الدخول -->
    <div class="modal" id="authModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('authModal')">&times;</span>
            <h2 id="authModalTitle" style="color: var(--primary-color); margin-bottom: 10px; text-align: center;">تسجيل الدخول</h2>
            
            <form id="authForm" onsubmit="handleAuthSubmit(event)">
                <div class="form-group" id="nameFieldGroup" style="display: none;">
                    <label>الاسم الكامل</label>
                    <input type="text" id="authName" placeholder="اسمك الكامل">
                </div>
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="authEmail" required placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="authPassword" required placeholder="••••••••">
                    <span class="forgot-link" onclick="openForgotModal()">هل نسيت كلمة السر؟</span>
                </div>
                <button type="submit" class="btn-action" id="authSubmitBtn" style="width: 100%; justify-content: center; margin-top: 8px;">دخول</button>
            </form>
            <div class="form-switch-text"><span onclick="toggleAuthMode()" id="switchAuthText">إنشاء حساب جديد عبر البريد</span></div>
        </div>
    </div>

    <!-- Modal: نسيت كلمة السر -->
    <div class="modal" id="forgotModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('forgotModal')">&times;</span>
            <h2 style="color: var(--primary-color); margin-bottom: 4px; text-align: center;">إعادة تعيين كلمة السر</h2>
            <form id="forgotStep1" onsubmit="handleSendResetCode(event)">
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="resetEmailInput" required placeholder="name@gmail.com">
                </div>
                <button type="submit" class="btn-action" style="width: 100%; justify-content: center;">إرسال رمز التحقق</button>
            </form>
            <form id="forgotStep2" style="display: none;" onsubmit="handleVerifyAndReset(event)">
                <div class="form-group">
                    <label>رمز التحقق</label>
                    <input type="text" id="resetCodeInput" required placeholder="مثال: 123456" maxlength="6">
                </div>
                <div class="form-group">
                    <label>كلمة المرور الجديدة</label>
                    <input type="password" id="newResetPassword" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-action" style="width: 100%; justify-content: center;">تغيير كلمة المرور</button>
            </form>
        </div>
    </div>

    <!-- Modal: تأكيد الخروج -->
    <div class="modal" id="confirmLogoutModal">
        <div class="modal-content" style="text-align: center;">
            <span class="close-btn" onclick="closeModal('confirmLogoutModal')">&times;</span>
            <div style="font-size: 45px; color: var(--primary-color); margin-bottom: 10px;"><i class="fa-solid fa-circle-question"></i></div>
            <h3 style="margin-bottom: 8px;">تسجيل الخروج</h3>
            <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;">هل أنت متأكد من تسجيل الخروج من حسابك؟</p>
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button class="btn-action" style="width: 50%; justify-content: center; background: var(--primary-color);" onclick="confirmLogout()">نعم، خروج</button>
                <button class="btn-action" style="width: 50%; justify-content: center; background: #334155;" onclick="closeModal('confirmLogoutModal')">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- Modal: إضافة مطعم عام -->
    <div class="modal" id="addRestaurantModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('addRestaurantModal')">&times;</span>
            <h2 style="color: var(--primary-color); margin-bottom: 12px;">إضافة مطعم جديد (سينشر محلياً للعامة)</h2>
            <form id="addRestForm" onsubmit="handleSaveRestaurant(event)">
                <input type="hidden" id="editRestId">
                <div class="form-group">
                    <label>اسم المطعم</label>
                    <input type="text" id="newRestName" required placeholder="مثال: برغر هاوس">
                </div>
                <div class="form-group">
                    <label>الفئة</label>
                    <select id="newRestCat">
                        <option value="fastfood">وجبات سريعة</option>
                        <option value="pizza">بيتزا</option>
                        <option value="grill">مشاوي</option>
                        <option value="sweets">حلويات</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>صورة غلاف المطعم من الجهاز</label>
                    <input type="file" id="newRestImgFile" accept="image/*" onchange="handleRestImageFile(event)">
                </div>
                <div class="form-group">
                    <label>اسم الوجبة الأولى</label>
                    <input type="text" id="newItemName" required placeholder="مثال: تشيز برغر">
                </div>
                <div class="form-group">
                    <label>صورة الوجبة من الجهاز</label>
                    <input type="file" id="newItemImgFile" accept="image/*" onchange="handleMealImageFile(event)">
                </div>
                <div class="form-group">
                    <label>سعر الوجبة (د.ع)</label>
                    <input type="number" id="newItemPrice" required placeholder="7000">
                </div>
                <button type="submit" class="btn-action" style="width: 100%; justify-content: center; margin-top: 8px;">نشر المطعم</button>
            </form>
        </div>
    </div>

    <!-- سلة التسوق -->
    <div class="cart-sidebar" id="cartSidebar">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">
            <h3 style="font-size: 16px;">سلة التسوق <i class="fa-solid fa-basket-shopping" style="color: var(--primary-color);"></i></h3>
            <span style="cursor: pointer; font-size: 20px;" onclick="toggleCart()">&times;</span>
        </div>
        <div class="cart-items" id="cartItemsContainer"></div>
        <div style="border-top: 1px solid var(--border-color); padding-top: 12px;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px;">
                <span>المجموع:</span>
                <span id="cartTotal" style="color: var(--primary-color); font-weight: bold;">0 د.ع</span>
            </div>
            <button class="btn-action" style="width: 100%; justify-content: center;" onclick="checkout()">إتمام الطلب</button>
        </div>
    </div>

    <script>
        const defaultRestaurants = [
            {
                id: 1, ownerId: "system", name: "برغر اكسبرس", category: "fastfood",
                image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500", rating: "4.8", time: "20-30 دقيقة",
                menu: [
                    { id: 101, name: "كلاسيك برغر", price: 6000, image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500" },
                    { id: 102, name: "دبل تشيز برغر", price: 8500, image: "https://images.unsplash.com/photo-1586190848861-99aa4a171e90?w=500" }
                ]
            },
            {
                id: 2, ownerId: "system", name: "بيتزا روما", category: "pizza",
                image: "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500", rating: "4.6", time: "30-40 دقيقة",
                menu: [
                    { id: 201, name: "بيتزا مارغريتا", price: 9000, image: "https://images.unsplash.com/photo-1604382355076-af4b0eb60143?w=500" }
                ]
            }
        ];

        let restaurants = JSON.parse(localStorage.getItem('beshīqa_restaurants')) || defaultRestaurants;
        let usersDB = JSON.parse(localStorage.getItem('beshīqa_users')) || [];
        let currentUser = JSON.parse(localStorage.getItem('beshīqa_user')) || null;
        let cart = [];
        let generatedResetCode = null;
        let resetUserEmail = null;
        let tempRestImgBase64 = "";
        let tempMealImgBase64 = "";

        function switchPage(pageId) {
            document.querySelectorAll('.page-view').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
            document.querySelectorAll('.bottom-nav-item').forEach(b => b.classList.remove('active'));
            if (pageId === 'homePage') document.getElementById('btnNavHome').classList.add('active');
            if (pageId === 'profilePage') document.getElementById('btnNavUser').classList.add('active');
        }

        function updateAuthUI() {
            const navAuthArea = document.getElementById('navAuthArea');
            const bottomNavText = document.getElementById('bottomNavUserText');
            if (currentUser) {
                if (navAuthArea) {
                    navAuthArea.innerHTML = `
                        <div class="user-pill" onclick="openMyProfilePage()">
                            <img src="${currentUser.avatar || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}">
                            <span>${currentUser.name}</span>
                        </div>
                        <button class="btn-action" onclick="openAddModal()"><i class="fa-solid fa-plus"></i> إضافة مطعم</button>
                        <button class="btn-action" style="background: #334155;" onclick="promptLogout()"><i class="fa-solid fa-right-from-bracket"></i></button>
                    `;
                }
                if (bottomNavText) bottomNavText.innerText = currentUser.name.split(' ')[0];
            } else {
                if (navAuthArea) {
                    navAuthArea.innerHTML = `<button class="btn-action" onclick="openAuthModal()"><i class="fa-solid fa-user"></i> دخول</button>`;
                }
                if (bottomNavText) bottomNavText.innerText = "حسابي";
            }
            updateCart();
        }

        function handleBottomUserClick() {
            if (currentUser) openMyProfilePage();
            else openAuthModal();
        }

        function promptLogout() { openModal('confirmLogoutModal'); }

        function confirmLogout() {
            currentUser = null;
            localStorage.removeItem('beshīqa_user');
            closeModal('confirmLogoutModal');
            switchPage('homePage');
            updateAuthUI();
            renderRestaurants();
        }

        function openMyProfilePage() {
            if (!currentUser) { openAuthModal(); return; }
            document.getElementById('profilePageAvatar').src = currentUser.avatar || 'https://cdn-icons-png.flaticon.com/512/149/149071.png';
            document.getElementById('profilePageName').innerText = currentUser.name;
            document.getElementById('profilePageEmail').innerText = currentUser.email;
            document.getElementById('profileInputName').value = currentUser.name;
            switchPage('profilePage');
        }

        function triggerAvatarUpload() { document.getElementById('avatarFileInput').click(); }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentUser.avatar = e.target.result;
                    document.getElementById('profilePageAvatar').src = currentUser.avatar;
                    localStorage.setItem('beshīqa_user', JSON.stringify(currentUser));
                    updateAuthUI();
                };
                reader.readAsDataURL(file);
            }
        }

        function handleSaveProfilePage(event) {
            event.preventDefault();
            if (!currentUser) return;
            currentUser.name = document.getElementById('profileInputName').value.trim();
            localStorage.setItem('beshīqa_user', JSON.stringify(currentUser));
            updateAuthUI();
            alert('تم الحفظ بنجاح!');
        }

        function openForgotModal() {
            closeModal('authModal');
            document.getElementById('forgotStep1').style.display = 'block';
            document.getElementById('forgotStep2').style.display = 'none';
            openModal('forgotModal');
        }

        function handleSendResetCode(event) {
            event.preventDefault();
            resetUserEmail = document.getElementById('resetEmailInput').value.trim();
            const userExists = usersDB.find(u => u.email === resetUserEmail);
            if (!userExists) { alert('البريد غير مسجل!'); return; }
            generatedResetCode = Math.floor(100000 + Math.random() * 900000).toString();
            alert(`رمز التحقق لـ (${resetUserEmail}) هو: ${generatedResetCode}`);
            document.getElementById('forgotStep1').style.display = 'none';
            document.getElementById('forgotStep2').style.display = 'block';
        }

        function handleVerifyAndReset(event) {
            event.preventDefault();
            if (document.getElementById('resetCodeInput').value.trim() !== generatedResetCode) {
                alert('رمز التحقق خاطئ!');
                return;
            }
            const uIdx = usersDB.findIndex(u => u.email === resetUserEmail);
            if (uIdx !== -1) {
                usersDB[uIdx].password = document.getElementById('newResetPassword').value;
                localStorage.setItem('beshīqa_users', JSON.stringify(usersDB));
                alert('تم تغيير كلمة السر بنجاح!');
                closeModal('forgotModal');
                openAuthModal();
            }
        }

        function openRestaurantPage(restId) {
            const rest = restaurants.find(r => r.id === restId);
            if (!rest) return;
            document.getElementById('restPageBanner').src = rest.image;
            document.getElementById('restPageTitle').innerText = rest.name;
            document.getElementById('restPageCat').innerText = getCategoryName(rest.category) + ' • ' + rest.time;

            const ownerActions = document.getElementById('restPageOwnerActions');
            if (currentUser && rest.ownerId === currentUser.id) {
                ownerActions.innerHTML = `<button class="btn-action" onclick="openEditModal(${rest.id})"><i class="fa-solid fa-pen-to-square"></i> تعديل</button>`;
            } else { ownerActions.innerHTML = ''; }

            const menuContainer = document.getElementById('restPageMenuContainer');
            menuContainer.innerHTML = '';
            rest.menu.forEach(item => {
                menuContainer.innerHTML += `
                    <div class="menu-item-card">
                        <img src="${item.image}" class="menu-item-img">
                        <div class="menu-item-details">
                            <div class="menu-item-name">${item.name}</div>
                            <div class="menu-item-price">${item.price.toLocaleString()} د.ع</div>
                            <button class="btn-action" style="width: 100%; justify-content: center; font-size: 11px; padding: 6px;" onclick="addToCart('${item.name}', ${item.price})"><i class="fa-solid fa-plus"></i> للسلة</button>
                        </div>
                    </div>
                `;
            });
            switchPage('restaurantDetailPage');
        }

        function handleRestImageFile(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => { tempRestImgBase64 = event.target.result; };
                reader.readAsDataURL(file);
            }
        }

        function handleMealImageFile(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => { tempMealImgBase64 = event.target.result; };
                reader.readAsDataURL(file);
            }
        }

        function handleSaveRestaurant(event) {
            event.preventDefault();
            if (!currentUser) return;
            const editId = document.getElementById('editRestId').value;
            const name = document.getElementById('newRestName').value;
            const category = document.getElementById('newRestCat').value;
            const itemName = document.getElementById('newItemName').value;
            const itemPrice = parseInt(document.getElementById('newItemPrice').value);

            const restImg = tempRestImgBase64 || "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=500";
            const mealImg = tempMealImgBase64 || "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500";

            if (editId) {
                let rest = restaurants.find(r => r.id == editId);
                if (rest && rest.ownerId === currentUser.id) {
                    rest.name = name;
                    rest.category = category;
                    if (tempRestImgBase64) rest.image = tempRestImgBase64;
                    rest.menu = [{ id: Date.now(), name: itemName, price: itemPrice, image: mealImg }];
                }
            } else {
                const newRest = {
                    id: Date.now(), ownerId: currentUser.id, name, category,
                    image: restImg, rating: "5.0", time: "20-30 دقيقة",
                    menu: [{ id: Date.now() + 1, name: itemName, price: itemPrice, image: mealImg }]
                };
                restaurants.push(newRest);
            }

            localStorage.setItem('beshīqa_restaurants', JSON.stringify(restaurants));
            renderRestaurants();
            closeModal('addRestaurantModal');
            tempRestImgBase64 = ""; tempMealImgBase64 = "";
            alert('تم نشر المطعم بنجاح!');
        }

        function renderRestaurants(data = restaurants) {
            const container = document.getElementById('restaurantsContainer');
            container.innerHTML = '';
            data.forEach(rest => {
                let isOwner = currentUser && rest.ownerId === currentUser.id;
                container.innerHTML += `
                    <div class="restaurant-card" onclick="openRestaurantPage(${rest.id})">
                        <img src="${rest.image}" class="restaurant-img">
                        ${isOwner ? '<span class="owner-badge"><i class="fa-solid fa-crown"></i> مطعمك</span>' : ''}
                        <div class="restaurant-info">
                            <div class="restaurant-name">${rest.name}</div>
                            <div class="restaurant-cat">${getCategoryName(rest.category)}</div>
                            <div class="restaurant-meta">
                                <span class="rating"><i class="fa-solid fa-star"></i> ${rest.rating}</span>
                                <span><i class="fa-regular fa-clock"></i> ${rest.time}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function getCategoryName(cat) {
            return { fastfood: "وجبات سريعة", pizza: "بيتزا", grill: "مشاوي", sweets: "حلويات" }[cat] || cat;
        }

        function filterCategory(category, btn) {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderRestaurants(category === 'all' ? restaurants : restaurants.filter(r => r.category === category));
        }

        function filterRestaurants() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            renderRestaurants(restaurants.filter(r => r.name.toLowerCase().includes(query)));
        }

        function openAuthModal() {
            document.getElementById('nameFieldGroup').style.display = "none";
            openModal('authModal');
        }

        function toggleAuthMode() {
            const nameGroup = document.getElementById('nameFieldGroup');
            const isReg = nameGroup.style.display === "none";
            nameGroup.style.display = isReg ? "block" : "none";
            document.getElementById('authSubmitBtn').innerText = isReg ? "إنشاء الحساب" : "دخول";
            document.getElementById('switchAuthText').innerText = isReg ? "لديك حساب؟ تسجيل الدخول" : "إنشاء حساب جديد عبر البريد";
        }

        function handleAuthSubmit(event) {
            event.preventDefault();
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value;
            const isReg = document.getElementById('nameFieldGroup').style.display !== "none";

            if (isReg) {
                const name = document.getElementById('authName').value.trim();
                if (usersDB.find(u => u.email === email)) { alert('البريد مسجل مسبقاً!'); return; }
                currentUser = { id: 'user_' + Date.now(), name, email, password, avatar: 'https://cdn-icons-png.flaticon.com/512/149/149071.png' };
                usersDB.push(currentUser);
                localStorage.setItem('beshīqa_users', JSON.stringify(usersDB));
            } else {
                const user = usersDB.find(u => u.email === email && u.password === password);
                if (!user) { alert('خطأ في البيانات!'); return; }
                currentUser = user;
            }
            localStorage.setItem('beshīqa_user', JSON.stringify(currentUser));
            closeModal('authModal');
            updateAuthUI();
            renderRestaurants();
        }

        function openAddModal() {
            if (!currentUser) { openAuthModal(); return; }
            document.getElementById('addRestForm').reset();
            openModal('addRestaurantModal');
        }

        function addToCart(name, price) {
            const existing = cart.find(item => item.name === name);
            if (existing) existing.qty++;
            else cart.push({ name, price, qty: 1 });
            updateCart();
        }

        function updateCart() {
            const cartContainer = document.getElementById('cartItemsContainer');
            cartContainer.innerHTML = '';
            let total = 0, count = 0;
            cart.forEach(item => {
                total += item.price * item.qty;
                count += item.qty;
                cartContainer.innerHTML += `
                    <div class="cart-item">
                        <div>
                            <div style="font-weight: bold; font-size: 13px;">${item.name}</div>
                            <div style="color: var(--text-muted); font-size: 11px;">${item.price.toLocaleString()} د.ع</div>
                        </div>
                        <span style="font-size: 13px; font-weight: bold;">x${item.qty}</span>
                    </div>
                `;
            });
            document.getElementById('cartCountBottom').innerText = count;
            document.getElementById('cartTotal').innerText = total.toLocaleString() + ' د.ع';
        }

        function toggleCart() { document.getElementById('cartSidebar').classList.toggle('open'); }
        function checkout() {
            if (cart.length === 0) return alert('السلة فارغة!');
            alert('تم استلام طلبك بنجاح!');
            cart = []; updateCart(); toggleCart();
        }

        function focusSearch() { switchPage('homePage'); document.getElementById('searchInput').focus(); }
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        updateAuthUI();
        renderRestaurants();
    </script>
</body>
</html>
