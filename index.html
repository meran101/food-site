<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مطاعم بعشيقة | منصة طلب الطعام</title>
    <!-- FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary-color: #ff5a00;
            --primary-hover: #e04f00;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #22c55e;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 50px;
        }

        /* Navbar */
        .navbar {
            background-color: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .logo {
            font-size: 22px;
            font-weight: 900;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .search-box {
            flex: 1;
            max-width: 350px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 10px 40px 10px 15px;
            border-radius: 25px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-dark);
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .search-box i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-action {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.3s;
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 90, 0, 0.4);
        }

        .cart-btn {
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            position: relative;
        }

        .cart-count {
            position: absolute;
            top: -5px;
            left: -5px;
            background-color: var(--primary-color);
            color: white;
            font-size: 11px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* User Profile Pill in Nav */
        .user-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
        }

        .user-pill:hover {
            border-color: var(--primary-color);
        }

        .user-pill img {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
        }

        /* Container & Categories */
        .main-container {
            max-width: 1200px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .categories {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 25px;
        }

        .category-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: 20px;
            white-space: nowrap;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .category-btn.active, .category-btn:hover {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Restaurants Grid */
        .restaurants-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .restaurant-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: 0.3s;
            cursor: pointer;
            position: relative;
        }

        .restaurant-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border-color: var(--primary-color);
        }

        .restaurant-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }

        .restaurant-info {
            padding: 15px;
        }

        .restaurant-name {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .restaurant-cat {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 12px;
        }

        .restaurant-meta {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
        }

        .rating {
            color: #f59e0b;
            font-weight: bold;
        }

        .owner-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(34, 197, 94, 0.9);
            color: white;
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 10px;
            font-weight: bold;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 15px;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background-color: var(--card-bg);
            border-radius: 20px;
            width: 100%;
            max-width: 750px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            position: relative;
            padding: 30px;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 24px;
            color: var(--text-muted);
            cursor: pointer;
            z-index: 10;
        }

        .modal-header-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        /* Menu Grid */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .menu-item-card {
            background-color: var(--bg-dark);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .menu-item-img {
            width: 100%;
            height: 110px;
            object-fit: cover;
        }

        .menu-item-details {
            padding: 12px;
        }

        .menu-item-name {
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 5px;
        }

        .menu-item-price {
            color: var(--primary-color);
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        /* Forms & Inputs */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-dark);
            color: #fff;
            outline: none;
            font-size: 14px;
        }

        .form-switch-text {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .form-switch-text span {
            color: var(--primary-color);
            cursor: pointer;
            font-weight: bold;
        }

        /* Cart Sidebar */
        .cart-sidebar {
            position: fixed;
            top: 0;
            left: -400px;
            width: 100%;
            max-width: 380px;
            height: 100%;
            background-color: var(--card-bg);
            z-index: 1100;
            box-shadow: 5px 0 25px rgba(0, 0, 0, 0.5);
            transition: 0.4s ease;
            display: flex;
            flex-direction: column;
            padding: 20px;
            border-right: 1px solid var(--border-color);
        }

        .cart-sidebar.open {
            left: 0;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            margin: 15px 0;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="logo"><i class="fa-solid fa-utensils"></i> مطاعم بعشيقة</a>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="ابحث عن مطعم أو وجبة..." onkeyup="filterRestaurants()">
            </div>
            <div class="nav-actions" id="navAuthArea">
                <!-- سيتم تعبئتها ديناميكياً عبر الجافاسكريبت حسب حالة تسجيل الدخول -->
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-container">
        <!-- Categories -->
        <div class="categories">
            <button class="category-btn active" onclick="filterCategory('all', this)"><i class="fa-solid fa-border-all"></i> الكل</button>
            <button class="category-btn" onclick="filterCategory('fastfood', this)"><i class="fa-solid fa-burger"></i> وجبات سريعة</button>
            <button class="category-btn" onclick="filterCategory('pizza', this)"><i class="fa-solid fa-pizza-slice"></i> بيتزا</button>
            <button class="category-btn" onclick="filterCategory('grill', this)"><i class="fa-solid fa-drumstick-bite"></i> مشاوي</button>
            <button class="category-btn" onclick="filterCategory('sweets', this)"><i class="fa-solid fa-ice-cream"></i> حلويات</button>
        </div>

        <h2 class="section-title"><i class="fa-solid fa-store" style="color: var(--primary-color);"></i> المطاعم المتاحة</h2>
        
        <!-- Restaurants Grid -->
        <div class="restaurants-grid" id="restaurantsContainer"></div>
    </div>

    <!-- Modal: Auth (Login / Register) -->
    <div class="modal" id="authModal">
        <div class="modal-content" style="max-width: 400px;">
            <span class="close-btn" onclick="closeModal('authModal')">&times;</span>
            <h2 id="authModalTitle" style="color: var(--primary-color); margin-bottom: 5px; text-align: center;">تسجيل الدخول</h2>
            <p id="authModalSub" style="color: var(--text-muted); font-size: 13px; margin-bottom: 20px; text-align: center;">أدخل بريدك الإلكتروني وكلمة المرور للمتابعة</p>
            
            <form id="authForm" onsubmit="handleAuthSubmit(event)">
                <div class="form-group" id="nameFieldGroup" style="display: none;">
                    <label>الاسم الكامل</label>
                    <input type="text" id="authName" placeholder="أدخل اسمك الكامل">
                </div>
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="authEmail" required placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="authPassword" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-action" id="authSubmitBtn" style="width: 100%; justify-content: center; margin-top: 10px;">دخول</button>
            </form>

            <div class="form-switch-text" id="authSwitchText">
                ليس لديك حساب؟ <span onclick="toggleAuthMode()">إنشاء حساب جديد</span>
            </div>
        </div>
    </div>

    <!-- Modal: Edit Profile -->
    <div class="modal" id="profileModal">
        <div class="modal-content" style="max-width: 450px;">
            <span class="close-btn" onclick="closeModal('profileModal')">&times;</span>
            <h2 style="color: var(--primary-color); margin-bottom: 15px;">تعديل الملف الشخصي</h2>
            <form onsubmit="handleSaveProfile(event)">
                <div class="form-group">
                    <label>الاسم الظاهر</label>
                    <input type="text" id="editProfileName" required>
                </div>
                <div class="form-group">
                    <label>رابط الصورة الشخصية (Avatar URL)</label>
                    <input type="url" id="editProfileAvatar" required placeholder="https://example.com/avatar.jpg">
                </div>
                <button type="submit" class="btn-action" style="width: 100%; justify-content: center; margin-top: 10px;">حفظ التغييرات</button>
            </form>
        </div>
    </div>

    <!-- Modal: Restaurant Profile & Full Menu -->
    <div class="modal" id="menuModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('menuModal')">&times;</span>
            <img id="modalRestImg" class="modal-header-img" src="" alt="صورة المطعم">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h2 id="modalRestName" style="color: var(--primary-color); margin-bottom: 5px;"></h2>
                    <p id="modalRestCat" style="color: var(--text-muted); font-size: 13px; margin-bottom: 15px;"></p>
                </div>
                <div id="ownerActionsContainer"></div>
            </div>
            
            <h3 style="border-bottom: 1px solid var(--border-color); padding-bottom: 8px; margin-top: 15px; margin-bottom: 15px;"><i class="fa-solid fa-utensils"></i> قائمة الطعام</h3>
            <div class="menu-grid" id="menuContainer"></div>
        </div>
    </div>

    <!-- Modal: Add / Edit Restaurant -->
    <div class="modal" id="addRestaurantModal">
        <div class="modal-content" style="max-width: 600px;">
            <span class="close-btn" onclick="closeModal('addRestaurantModal')">&times;</span>
            <h2 id="modalFormTitle" style="color: var(--primary-color); margin-bottom: 15px;">إضافة مطعم جديد</h2>
            <form id="addRestForm" onsubmit="handleSaveRestaurant(event)">
                <input type="hidden" id="editRestId">
                <div class="form-group">
                    <label>اسم المطعم</label>
                    <input type="text" id="newRestName" required placeholder="مثال: برغر هاوس">
                </div>
                <div class="form-group">
                    <label>الفئة</label>
                    <select id="newRestCat">
                        <option value="fastfood">وجبات سريعة</option>
                        <option value="pizza">بيتزا</option>
                        <option value="grill">مشاوي</option>
                        <option value="sweets">حلويات</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>رابط صورة المطعم</label>
                    <input type="url" id="newRestImg" required placeholder="https://example.com/image.jpg">
                </div>
                <div class="form-group">
                    <label>اسم الوجبة</label>
                    <input type="text" id="newItemName" required placeholder="مثال: تشيز برغر">
                </div>
                <div class="form-group">
                    <label>رابط صورة الوجبة</label>
                    <input type="url" id="newItemImg" required placeholder="https://example.com/meal.jpg">
                </div>
                <div class="form-group">
                    <label>سعر الوجبة (د.ع)</label>
                    <input type="number" id="newItemPrice" required placeholder="مثال: 7000">
                </div>
                <button type="submit" class="btn-action" style="width: 100%; justify-content: center; margin-top: 10px;">حفظ المطعم</button>
            </form>
        </div>
    </div>

    <!-- Cart Sidebar -->
    <div class="cart-sidebar" id="cartSidebar">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">
            <h3>سلة التسوق <i class="fa-solid fa-basket-shopping" style="color: var(--primary-color);"></i></h3>
            <span style="cursor: pointer; font-size: 20px;" onclick="toggleCart()">&times;</span>
        </div>
        <div class="cart-items" id="cartItemsContainer"></div>
        <div style="border-top: 1px solid var(--border-color); padding-top: 15px;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                <span>المجموع:</span>
                <span id="cartTotal" style="color: var(--primary-color); font-weight: bold;">0 د.ع</span>
            </div>
            <button class="btn-action" style="width: 100%; justify-content: center;" onclick="checkout()">إتمام الطلب</button>
        </div>
    </div>

    <script>
        // البيانات الافتراضية
        const defaultRestaurants = [
            {
                id: 1,
                ownerId: "system",
                name: "برغر اكسبرس",
                category: "fastfood",
                image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500",
                rating: "4.8",
                time: "20-30 دقيقة",
                menu: [
                    { id: 101, name: "كلاسيك برغر", price: 6000, image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500" },
                    { id: 102, name: "دبل تشيز برغر", price: 8500, image: "https://images.unsplash.com/photo-1586190848861-99aa4a171e90?w=500" }
                ]
            },
            {
                id: 2,
                ownerId: "system",
                name: "بيتزا روما",
                category: "pizza",
                image: "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500",
                rating: "4.6",
                time: "30-40 دقيقة",
                menu: [
                    { id: 201, name: "بيتزا مارغريتا", price: 9000, image: "https://images.unsplash.com/photo-1604382355076-af4b0eb60143?w=500" }
                ]
            }
        ];

        let restaurants = JSON.parse(localStorage.getItem('beshīqa_restaurants')) || defaultRestaurants;
        let usersDB = JSON.parse(localStorage.getItem('beshīqa_users')) || [];
        let currentUser = JSON.parse(localStorage.getItem('beshīqa_user')) || null;
        let cart = [];
        let currentActiveRestId = null;
        let isRegisterMode = false;

        // تحديث واجهة الهيدر (تسجيل الدخول / الملف الشخصي)
        function updateAuthUI() {
            const navAuthArea = document.getElementById('navAuthArea');
            if (currentUser) {
                navAuthArea.innerHTML = `
                    <div class="user-pill" onclick="openProfileModal()" title="تعديل الملف الشخصي">
                        <img src="${currentUser.avatar || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}" alt="User">
                        <span>${currentUser.name}</span>
                    </div>
                    <button class="btn-action" onclick="openAddModal()"><i class="fa-solid fa-plus"></i> إضافة مطعم</button>
                    <button class="btn-action cart-btn" onclick="toggleCart()"><i class="fa-solid fa-cart-shopping"></i> <span class="cart-count" id="cartCount">0</span></button>
                    <button class="btn-action" style="background: #334155;" onclick="logout()" title="تسجيل الخروج"><i class="fa-solid fa-right-from-bracket"></i></button>
                `;
            } else {
                navAuthArea.innerHTML = `
                    <button class="btn-action" onclick="openAuthModal()"><i class="fa-solid fa-user"></i> تسجيل الدخول</button>
                    <button class="btn-action cart-btn" onclick="toggleCart()"><i class="fa-solid fa-cart-shopping"></i> <span class="cart-count" id="cartCount">0</span></button>
                `;
            }
            updateCart();
        }

        // تبديل نافذة الدخول بين تسجيل الدخول وإنشاء حساب
        function openAuthModal() {
            isRegisterMode = false;
            updateAuthModalView();
            openModal('authModal');
        }

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            updateAuthModalView();
        }

        function updateAuthModalView() {
            const title = document.getElementById('authModalTitle');
            const sub = document.getElementById('authModalSub');
            const nameGroup = document.getElementById('nameFieldGroup');
            const submitBtn = document.getElementById('authSubmitBtn');
            const switchText = document.getElementById('authSwitchText');

            if (isRegisterMode) {
                title.innerText = "إنشاء حساب جديد";
                sub.innerText = "أدخل بياناتك لإنشاء حساب جديد واستخدامه في الموقع";
                nameGroup.style.display = "block";
                document.getElementById('authName').required = true;
                submitBtn.innerText = "إنشاء الحساب";
                switchText.innerHTML = `لديك حساب بالفعل؟ <span onclick="toggleAuthMode()">تسجيل الدخول</span>`;
            } else {
                title.innerText = "تسجيل الدخول";
                sub.innerText = "أدخل بريدك الإلكتروني وكلمة المرور للوصول لحسابك";
                nameGroup.style.display = "none";
                document.getElementById('authName').required = false;
                submitBtn.innerText = "دخول";
                switchText.innerHTML = `ليس لديك حساب؟ <span onclick="toggleAuthMode()">إنشاء حساب جديد</span>`;
            }
        }

        // معالجة إرسال نموذج الدخول أو التسجيل
        function handleAuthSubmit(event) {
            event.preventDefault();
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value;

            if (isRegisterMode) {
                const name = document.getElementById('authName').value.trim();
                // التحقق هل البريد مسجل مسبقاً
                const existingUser = usersDB.find(u => u.email === email);
                if (existingUser) {
                    alert('هذا البريد الإلكتروني مسجل مسبقاً! يرجى تسجيل الدخول.');
                    return;
                }

                const newUser = {
                    id: 'user_' + Date.now(),
                    name: name,
                    email: email,
                    password: password,
                    avatar: 'https://cdn-icons-png.flaticon.com/512/149/149071.png'
                };

                usersDB.push(newUser);
                localStorage.setItem('beshīqa_users', JSON.stringify(usersDB));

                currentUser = newUser;
                localStorage.setItem('beshīqa_user', JSON.stringify(currentUser));
                
                closeModal('authModal');
                updateAuthUI();
                renderRestaurants();
                alert('تم إنشاء الحساب وتسجيل الدخول بنجاح!');
            } else {
                // محاولة تسجيل الدخول للمستخدم عبر البريد والباسورد
                const foundUser = usersDB.find(u => u.email === email && u.password === password);
                if (!foundUser) {
                    alert('البريد الإلكتروني أو كلمة المرور غير صحيحة!');
                    return;
                }

                currentUser = foundUser;
                localStorage.setItem('beshīqa_user', JSON.stringify(currentUser));

                closeModal('authModal');
                updateAuthUI();
                renderRestaurants();
                alert('مرحباً بعودتك، ' + currentUser.name + '!');
            }
            document.getElementById('authForm').reset();
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('beshīqa_user');
            updateAuthUI();
            renderRestaurants();
            alert('تم تسجيل الخروج بنجاح.');
        }

        // تعديل الملف الشخصي
        function openProfileModal() {
            if (!currentUser) return;
            document.getElementById('editProfileName').value = currentUser.name;
            document.getElementById('editProfileAvatar').value = currentUser.avatar;
            openModal('profileModal');
        }

        function handleSaveProfile(event) {
            event.preventDefault();
            if (!currentUser) return;

            currentUser.name = document.getElementById('editProfileName').value.trim();
            currentUser.avatar = document.getElementById('editProfileAvatar').value.trim();

            // تحديث في جدول المستخدمين العام أيضا
            const index = usersDB.findIndex(u => u.id === currentUser.id);
            if (index !== -1) {
                usersDB[index] = currentUser;
                localStorage.setItem('beshīqa_users', JSON.stringify(usersDB));
            }

            localStorage.setItem('beshīqa_user', JSON.stringify(currentUser));
            closeModal('profileModal');
            updateAuthUI();
            alert('تم تحديث الملف الشخصي بنجاح!');
        }

        // عرض المطاعم
        function renderRestaurants(data = restaurants) {
            const container = document.getElementById('restaurantsContainer');
            container.innerHTML = '';
            
            data.forEach(rest => {
                let isOwner = currentUser && rest.ownerId === currentUser.id;
                container.innerHTML += `
                    <div class="restaurant-card" onclick="openMenu(${rest.id})">
                        <img src="${rest.image}" class="restaurant-img" alt="${rest.name}">
                        ${isOwner ? '<span class="owner-badge"><i class="fa-solid fa-crown"></i> مطعمك</span>' : ''}
                        <div class="restaurant-info">
                            <div class="restaurant-name">${rest.name}</div>
                            <div class="restaurant-cat">${getCategoryName(rest.category)}</div>
                            <div class="restaurant-meta">
                                <span class="rating"><i class="fa-solid fa-star"></i> ${rest.rating}</span>
                                <span><i class="fa-regular fa-clock"></i> ${rest.time}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function getCategoryName(cat) {
            const names = { fastfood: "وجبات سريعة", pizza: "بيتزا", grill: "مشاوي", sweets: "حلويات" };
            return names[cat] || cat;
        }

        // تصفية المطاعم
        function filterCategory(category, btn) {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (category === 'all') {
                renderRestaurants(restaurants);
            } else {
                renderRestaurants(restaurants.filter(r => r.category === category));
            }
        }

        function filterRestaurants() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            renderRestaurants(restaurants.filter(r => r.name.toLowerCase().includes(query)));
        }

        // فتح صفحة المطعم وقائمة الوجبات
        function openMenu(restId) {
            currentActiveRestId = restId;
            const rest = restaurants.find(r => r.id === restId);
            document.getElementById('modalRestName').innerText = rest.name;
            document.getElementById('modalRestCat').innerText = getCategoryName(rest.category);
            document.getElementById('modalRestImg').src = rest.image;
            
            const ownerActions = document.getElementById('ownerActionsContainer');
            if (currentUser && rest.ownerId === currentUser.id) {
                ownerActions.innerHTML = `<button class="btn-action" onclick="openEditModal(${rest.id})"><i class="fa-solid fa-pen-to-square"></i> تعديل المطعم</button>`;
            } else {
                ownerActions.innerHTML = '';
            }

            const menuContainer = document.getElementById('menuContainer');
            menuContainer.innerHTML = '';
            
            rest.menu.forEach(item => {
                menuContainer.innerHTML += `
                    <div class="menu-item-card">
                        <img src="${item.image}" class="menu-item-img" alt="${item.name}">
                        <div class="menu-item-details">
                            <div class="menu-item-name">${item.name}</div>
                            <div class="menu-item-price">${item.price.toLocaleString()} د.ع</div>
                            <button class="btn-action" style="width: 100%; justify-content: center;" onclick="addToCart('${item.name}', ${item.price})"><i class="fa-solid fa-plus"></i> إضافة للسلة</button>
                        </div>
                    </div>
                `;
            });

            openModal('menuModal');
        }

        function openAddModal() {
            if (!currentUser) {
                openAuthModal();
                return;
            }
            document.getElementById('modalFormTitle').innerText = 'إضافة مطعم جديد';
            document.getElementById('editRestId').value = '';
            document.getElementById('addRestForm').reset();
            openModal('addRestaurantModal');
        }

        function openEditModal(restId) {
            closeModal('menuModal');
            const rest = restaurants.find(r => r.id === restId);
            document.getElementById('modalFormTitle').innerText = 'تعديل بيانات المطعم';
            document.getElementById('editRestId').value = rest.id;
            document.getElementById('newRestName').value = rest.name;
            document.getElementById('newRestCat').value = rest.category;
            document.getElementById('newRestImg').value = rest.image;
            if (rest.menu.length > 0) {
                document.getElementById('newItemName').value = rest.menu[0].name;
                document.getElementById('newItemImg').value = rest.menu[0].image;
                document.getElementById('newItemPrice').value = rest.menu[0].price;
            }
            openModal('addRestaurantModal');
        }

        function handleSaveRestaurant(event) {
            event.preventDefault();
            if (!currentUser) return;

            const editId = document.getElementById('editRestId').value;
            const name = document.getElementById('newRestName').value;
            const category = document.getElementById('newRestCat').value;
            const image = document.getElementById('newRestImg').value;
            const itemName = document.getElementById('newItemName').value;
            const itemImg = document.getElementById('newItemImg').value;
            const itemPrice = parseInt(document.getElementById('newItemPrice').value);

            if (editId) {
                let rest = restaurants.find(r => r.id == editId);
                if (rest && rest.ownerId === currentUser.id) {
                    rest.name = name;
                    rest.category = category;
                    rest.image = image;
                    rest.menu = [{ id: Date.now(), name: itemName, price: itemPrice, image: itemImg }];
                }
            } else {
                const newRest = {
                    id: Date.now(),
                    ownerId: currentUser.id,
                    name,
                    category,
                    image,
                    rating: "5.0",
                    time: "20-30 دقيقة",
                    menu: [{ id: Date.now() + 1, name: itemName, price: itemPrice, image: itemImg }]
                };
                restaurants.push(newRest);
            }

            localStorage.setItem('beshīqa_restaurants', JSON.stringify(restaurants));
            renderRestaurants();
            closeModal('addRestaurantModal');
            document.getElementById('addRestForm').reset();
            alert('تم حفظ بيانات المطعم بنجاح!');
        }

        // إدارة السلة
        function addToCart(name, price) {
            const existing = cart.find(item => item.name === name);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ name, price, qty: 1 });
            }
            updateCart();
        }

        function updateCart() {
            const cartContainer = document.getElementById('cartItemsContainer');
            cartContainer.innerHTML = '';
            let total = 0;
            let count = 0;

            cart.forEach(item => {
                total += item.price * item.qty;
                count += item.qty;
                cartContainer.innerHTML += `
                    <div class="cart-item">
                        <div>
                            <div style="font-weight: bold; font-size: 14px;">${item.name}</div>
                            <div style="color: var(--text-muted); font-size: 12px;">${item.price.toLocaleString()} د.ع</div>
                        </div>
                        <span>x${item.qty}</span>
                    </div>
                `;
            });

            const cartCountEl = document.getElementById('cartCount');
            if (cartCountEl) cartCountEl.innerText = count;
            const cartTotalEl = document.getElementById('cartTotal');
            if (cartTotalEl) cartTotalEl.innerText = total.toLocaleString() + ' د.ع';
        }

        function toggleCart() {
            document.getElementById('cartSidebar').classList.toggle('open');
        }

        function checkout() {
            if (cart.length === 0) {
                alert('السلة فارغة!');
                return;
            }
            alert('تم استلام طلبك بنجاح! سيصلك الطلب قريباً.');
            cart = [];
            updateCart();
            toggleCart();
        }

        // التحكم في النوافذ المنبثقة
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // التشغيل الأولي
        updateAuthUI();
        renderRestaurants();
    </script>
</body>
</html>
